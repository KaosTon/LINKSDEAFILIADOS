<body>
<div id="stage">
  <svg id="cena" viewBox="0 0 1080 1920" font-family="Inter">
    <ellipse id="chao" cx="540" cy="1512" rx="470" ry="46" fill="#0a1f45" opacity=".07"/>
    <!-- caixa -->

      <ellipse cx="0" cy="6" rx="150" ry="20" fill="#0a1f45" opacity=".12"/>
      <rect x="-130" y="-210" width="260" height="210" rx="18" fill="#d9a066"/>
      <rect x="-130" y="-210" width="260" height="210" rx="18" fill="none" stroke="#b97d44" stroke-width="6"/>
      <rect x="-22" y="-210" width="44" height="210" fill="#e9c08e"/>
      <g id="abaE"><rect x="-130" y="-34" width="130" height="34" rx="10" fill="#c98f55" stroke="#b97d44" stroke-width="5"/></g>

    <g id="volta" opacity="0"><rect x="-190" y="-44" width="380" height="88" rx="44" fill="#1f9d55"/><text y="15" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">Dinheiro de volta</text></g>
    <!-- boneco (origem nos pes) -->
    <g id="boneco">
      <ellipse cx="0" cy="8" rx="120" ry="18" fill="#0a1f45" opacity=".14"/>
      <g id="corpo">
        <rect x="-58" y="-128" width="46" height="128" rx="22" fill="#0d2f66"/>
        <rect x="12" y="-128" width="46" height="128" rx="22" fill="#0d2f66"/>
        <ellipse cx="-38" cy="-4" rx="36" ry="16" fill="#07142e"/>
        <ellipse cx="38" cy="-4" rx="36" ry="16" fill="#07142e"/>
        <g id="tronco">
          <g id="bracoE" transform="translate(-74,-282)"><g id="omE"><line x1="0" y1="0" x2="0" y2="92" stroke="#e8551f" stroke-width="40" stroke-linecap="round"/><g transform="translate(0,92)"><g id="ctE"><line x1="0" y1="0" x2="0" y2="80" stroke="#f26027" stroke-width="36" stroke-linecap="round"/><circle cx="0" cy="92" r="23" fill="#f2c29b"/></g></g></g></g>
          <rect x="-82" y="-310" width="164" height="200" rx="56" fill="#f26027"/>
          <path d="M-30 -310 Q0 -276 30 -310" fill="none" stroke="#c9461a" stroke-width="8" stroke-linecap="round"/>
          <rect x="-34" y="-196" width="68" height="46" rx="16" fill="#e8551f"/>
          <g id="cabeca" transform="translate(0,-318)">
            <circle cx="-80" cy="-72" r="16" fill="#eab48b"/><circle cx="80" cy="-72" r="16" fill="#eab48b"/>
            <circle cx="0" cy="-78" r="82" fill="#f2c29b"/>
            <path d="M-82 -84 A82 82 0 0 1 82 -84 Q60 -118 20 -112 Q-30 -104 -82 -84 Z" fill="#0a1f45"/>
            <g id="olhos"><g id="olhoE" transform="translate(-30,-70)"><ellipse rx="10" ry="13" fill="#0a1f45"/></g><g id="olhoD" transform="translate(30,-70)"><ellipse rx="10" ry="13" fill="#0a1f45"/></g></g>
            <line id="sobE" x1="-44" y1="-98" x2="-16" y2="-98" stroke="#0a1f45" stroke-width="8" stroke-linecap="round"/>
            <line id="sobD" x1="16" y1="-98" x2="44" y2="-98" stroke="#0a1f45" stroke-width="8" stroke-linecap="round"/>
            <circle cx="-52" cy="-44" r="13" fill="#f29b7a" opacity=".55"/><circle cx="52" cy="-44" r="13" fill="#f29b7a" opacity=".55"/>
            <path id="boca" d="M-24 -38 Q0 -20 24 -38" fill="none" stroke="#0a1f45" stroke-width="9" stroke-linecap="round"/>
          </g>
          <g id="bracoD" transform="translate(74,-282)"><g id="omD"><line x1="0" y1="0" x2="0" y2="92" stroke="#e8551f" stroke-width="40" stroke-linecap="round"/><g transform="translate(0,92)"><g id="ctD"><line x1="0" y1="0" x2="0" y2="80" stroke="#f26027" stroke-width="36" stroke-linecap="round"/>
            <g id="fone" transform="translate(0,92)"><g id="foneGiro"><rect x="-46" y="-150" width="92" height="170" rx="20" fill="#0a1f45"/><rect x="-38" y="-140" width="76" height="150" rx="13" fill="#fff"/><rect x="-28" y="-128" width="56" height="52" rx="8" fill="#ffe1c2"/><rect id="botao" x="-28" y="-62" width="56" height="26" rx="13" fill="#e53b2c"/><g id="feito" opacity="0"><circle cx="0" cy="-90" r="30" fill="#1f9d55"/><path d="M-13 -90 L-4 -80 L14 -101" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
            <circle cx="0" cy="92" r="23" fill="#f2c29b"/></g></g></g></g>
        </g>
      </g>
    </g>
  </svg>
  <div class="fala" id="f1"><span class="selo">VOCÊ SABIA?</span><div class="h">Comprou pela<br><b>internet</b>...</div></div>
  <div class="fala" id="f2"><div class="h">...chegou, e <b>não era</b><br>bem isso?</div></div>
  <div class="fala" id="f3"><div class="h">Você tem <b>7 dias</b><br>para desistir</div><div class="s">Contados da entrega, sem precisar dar motivo.</div></div>
  <div class="fala" id="f4"><div class="h">E o dinheiro <b>volta</b>,<br>com o frete junto</div><div class="s">Art. 49 do Código de Defesa do Consumidor</div></div>
  <div id="fim"><img src="../../../site/marca/tem-descontos.png"><div class="h">Mais dicas de compra<br>no nosso perfil</div><div class="arroba">@temdescontos</div></div>

<script>
/* ===== Timing helpers: every value is a pure function of t (seconds) ===== */
window.DURATION = 17.5;
const cl = x => Math.max(0, Math.min(1, x));
const p  = (t, a, b) => cl((t - a) / (b - a));          // 0..1 progress of t inside [a,b]
const lerp = (a, b, k) => a + (b - a) * k;

/* --- Motion tokens. Pick by ROLE, not by feel. --- */
const T = { micro:.08, fast:.18, normal:.35, slow:.6, crawl:1.0 };   // badge/icon .18, card .35, hero .6, counters 1.0
const D = { xs:16, sm:32, md:56, lg:80, xl:110 };                    // travel in px on a 1080-wide frame; small things travel less
const EXIT = .6;                                                     // exits take ~60% of the enter time, with half the travel

/* --- Easing. Default to smooth ease-out; never linear for UI. --- */
const bez = (x1, y1, x2, y2) => x => {                               // CSS cubic-bezier evaluated in JS
  if (x <= 0) return 0; if (x >= 1) return 1;
  let u = x; for (let i = 0; i < 8; i++) {
    const bx = 3*x1*u*(1-u)**2 + 3*x2*u*u*(1-u) + u**3 - x;
    const d = 3*x1*(1-u)**2 + 6*(x2-x1)*u*(1-u) + 3*(1-x2)*u*u; if (Math.abs(d) < 1e-6) break; u -= bx / d; }
  return 3*y1*u*(1-u)**2 + 3*y2*u*u*(1-u) + u**3;
};
const smooth = bez(.22, 1, .36, 1);       // default ease-out (expo-like)
const sharp  = bez(.4, 0, .2, 1);         // decisive UI moves
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;   // camera moves, pans
const eo = x => 1 - Math.pow(1 - x, 3);

/* Damped spring, closed form. s = seconds since start. Presets:
   noBounce {k:170, c:26} default · gentle {k:120, c:14} cards · snappy {k:300, c:30} UI · bouncy {k:400, c:10} playful only */
const SPR = { noBounce:{k:170,c:26}, gentle:{k:120,c:14}, snappy:{k:300,c:30}, bouncy:{k:400,c:10} };
function spring(s, {k, c} = SPR.noBounce) {
  if (s <= 0) return 0;
  const w0 = Math.sqrt(k), z = c / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z*z);
    return 1 - Math.exp(-z*w0*s) * (Math.cos(wd*s) + (z*w0/wd) * Math.sin(wd*s)); }
  return 1 - Math.exp(-w0*s) * (1 + w0*s);                           // critically damped fallback
}

/* Stagger: start time of item i. 0.05-0.10 s between items; under .05 reads mechanical, over .10 sluggish. */
const stagger = (i, a, step = .07, first = .1) => a + first + i * step;

/* Enter: opacity + small rise + blur 10px -> 0. Starts near full size (scale >= .95), never from 0. */
function enter(el, t, a, {dur = T.normal, dist = D.sm, blur = 10, scale = 1, ease = smooth} = {}) {
  const q = ease(p(t, a, a + dur));
  el.style.opacity = q;
  el.style.filter = blur ? `blur(${(1 - q) * blur}px)` : "";
  el.style.transform = `translateY(${(1 - q) * dist}px) scale(${lerp(scale, 1, q)})`;
  return q;
}

/* Scene in/out. Exit is shorter and quieter than the enter. */
function show(el, t, a, b, dist = D.md) {
  const i = smooth(p(t, a, a + T.slow)), o = sharp(p(t, b - T.slow * EXIT, b));
  el.style.opacity = Math.min(i, 1 - o);
  el.style.transform = `translateY(${(1 - i) * dist - o * dist / 2}px)`;
}

/* Counter: about 1 s, strong ease-out, rounded every frame. Put class="num" (tabular-nums) on the element. */
const count = (t, a, to, from = 0, dur = T.crawl) => Math.round(lerp(from, to, smooth(p(t, a, a + dur))));
/* Typewriter by slicing the string (never per-letter opacity). 25-40 chars per second. */
const typed = (text, t, a, cps = 32) => text.slice(0, Math.max(0, Math.floor((t - a) * cps)));

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("pt-BR");


/* ===== Personagem: um boneco articulado em SVG. Cada pose é um conjunto de ângulos; o quadro t mistura as poses. ===== */
const POSE0 = { sD:-28, cD:-118, sE:14, cE:10, boca:.9, sob:.2, inclina:0, olhaX:.5, olhaY:-.2, fone:1, pulo:0 };
// [inicio, duracao, pose]: a partir de "inicio", o boneco vai para a pose em "duracao" segundos (ease-out).
const POSES = [
  [1.55, .18, { cD:-126, sob:.5 }],                                  // toca em comprar
  [1.80, .30, { cD:-118, boca:1, sob:.7 }],                          // pedido feito: sorriso
  [3.50, .60, { sD:10, cD:14, fone:0, olhaX:1, olhaY:.5, sob:.3 }],  // baixa o celular, olha a caixa chegar
  [4.90, .50, { inclina:7, olhaY:.9, boca:.2 }],                     // inclina para olhar dentro
  [5.50, .50, { boca:-.75, sob:-.8, sE:-150, cE:-70 }],              // nao era isso: mao na cabeca
  [7.30, .60, { inclina:0, sE:14, cE:10, boca:.1, sob:.5, sD:-128, cD:-22, olhaX:.9, olhaY:-.5 }],  // aponta o calendario
  [9.80, .50, { boca:.8, sob:.6 }],                                  // entendeu: sorri
  [11.4, .60, { sD:-62, cD:-78, olhaX:.8, olhaY:.2, boca:.9 }],      // estende a mao para receber
  [13.6, .35, { boca:1, sob:.9, pulo:1 }],                           // comemora
  [14.1, .40, { pulo:0 }],
  [15.0, .50, { sD:-150, cD:-24, sE:14, cE:10, olhaX:0, olhaY:0, boca:1, sob:.5 }],  // acena
];
function poseEm(t) {
  const q = { ...POSE0 };
  for (const [a, dur, alvo] of POSES) {
    const k = smooth(p(t, a, a + dur));
    if (k <= 0) break;
    for (const c in alvo) q[c] = lerp(q[c], alvo[c], k);
  }
  return q;
}
const BX = 330, BY = 1500, BS = 1.62;        // posicao e escala do boneco no palco
function boneco(t) {
  const q = poseEm(t);
  const respira = Math.sin(t * 2.6) * 3;
  const pulo = -Math.sin(Math.min(1, q.pulo) * Math.PI) * 46;
  const acena = t > 15.3 ? Math.sin((t - 15.3) * 9) * 16 : 0;
  const kf = smooth(p(t, 14.8, 15.5));   // no fechamento o boneco vai para o centro, abaixo da marca
  $("boneco").setAttribute("transform", `translate(${lerp(BX, 540, kf)},${lerp(BY, 1590, kf)}) scale(${lerp(BS, 1.42, kf)})`);
  $("chao").setAttribute("opacity", .07 * (1 - kf));
  $("corpo").setAttribute("transform", `translate(0,${pulo})`);
  $("tronco").setAttribute("transform", `translate(0,${respira}) rotate(${q.inclina} 0 -120)`);
  $("omD").setAttribute("transform", `rotate(${q.sD + acena})`);
  $("ctD").setAttribute("transform", `rotate(${q.cD})`);
  $("omE").setAttribute("transform", `rotate(${q.sE})`);
  $("ctE").setAttribute("transform", `rotate(${q.cE})`);
  $("cabeca").setAttribute("transform", `translate(0,-318) rotate(${q.inclina * .5 + q.olhaX * 3})`);
  // rosto: piscada a cada ~3 s, olhar, sobrancelha e boca (curva: positiva sorri, negativa entristece)
  const pisca = (t % 3.1) < .12 ? .12 : 1;
  for (const [id, x] of [["olhoE", -30], ["olhoD", 30]]) $(id).setAttribute("transform", `translate(${x + q.olhaX * 7},${-70 + q.olhaY * 5}) scale(1,${pisca})`);
  $("sobE").setAttribute("transform", `translate(0,${-q.sob * 7}) rotate(${q.sob < 0 ? q.sob * 16 : 0} -30 -98)`);
  $("sobD").setAttribute("transform", `translate(0,${-q.sob * 7}) rotate(${q.sob < 0 ? -q.sob * 16 : 0} 30 -98)`);
  $("boca").setAttribute("d", `M-24 -38 Q0 ${-38 + q.boca * 22} 24 -38`);
  // celular: fica em pe na mao (desfaz o giro do braco) e some quando o braco baixa
  $("fone").setAttribute("opacity", cl(q.fone * 1.6));
  $("foneGiro").setAttribute("transform", `rotate(${-(q.sD + q.cD) - q.inclina})`);
  const aperta = 1 - .1 * Math.sin(p(t, 1.55, 1.9) * Math.PI);
  $("botao").setAttribute("transform", `translate(0,-49) scale(${aperta}) translate(0,49)`);
  $("feito").setAttribute("opacity", spring(t - 1.9, SPR.snappy));
  $("feito").setAttribute("transform", `translate(0,-90) scale(${lerp(.6, 1, spring(t - 1.9, SPR.snappy))}) translate(0,90)`);
}

/* ===== Objetos de cena ===== */
const DIAS = $("dias");
for (let i = 0; i < 7; i++) {
  const x = 28 + (i % 4) * 106 + (i >= 4 ? 53 : 0), y = 116 + Math.floor(i / 4) * 104;
  DIAS.insertAdjacentHTML("beforeend", `<g transform="translate(${x},${y})"><rect width="94" height="90" rx="20" fill="#fff4ea"/><g id="ok${i}"><rect width="94" height="90" rx="20" fill="#1f9d55"/><path d="M27 47 L41 61 L68 31" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g></g>`);
}
const MOEDAS = $("moedas");
for (let i = 0; i < 7; i++) MOEDAS.insertAdjacentHTML("beforeend", `<g id="m${i}" opacity="0"><circle r="34" fill="#f7b733" stroke="#d98f12" stroke-width="7"/><circle r="17" fill="none" stroke="#d98f12" stroke-width="5" opacity=".6"/></g>`);
const CX = 800, CY = 1500;                   // onde a caixa pousa

const CONF = $("conf"), CORES = ["#f7941d", "#e53b2c", "#1f9d55", "#0a1f45", "#f7b733"];
for (let i = 0; i < 22; i++) CONF.insertAdjacentHTML("beforeend", `<rect id="c${i}" x="-11" y="-7" width="22" height="14" rx="4" fill="${CORES[i % 5]}" opacity="0"/>`);
const rnd = i => { const x = Math.sin(i * 127.1 + 3.7) * 43758.5453; return x - Math.floor(x); };

function cena(t) {
  // confete na comemoracao: sobe em leque e cai com gravidade
  for (let i = 0; i < 22; i++) {
    const dt = t - 13.55, ang = lerp(-2.6, -.55, rnd(i)), vel = lerp(520, 980, rnd(i + 40));
    const x = 470 + Math.cos(ang) * vel * dt, y = 1010 + Math.sin(ang) * vel * dt + 900 * dt * dt;
    $("c" + i).setAttribute("opacity", dt > 0 ? cl(1 - (dt - .9) / .5) : 0);
    $("c" + i).setAttribute("transform", `translate(${x},${y}) rotate(${dt * lerp(-500, 500, rnd(i + 80))})`);
  }
  // caixa: cai com mola aos 3,7 s, abre as abas, fecha e vai embora aos 11,6 s
  const cai = spring(t - 3.7, SPR.gentle);
  const sai = sharp(p(t, 11.7, 12.6));
  $("caixa").setAttribute("opacity", cl((t - 3.7) * 6) * (1 - sai));
  $("caixa").setAttribute("transform", `translate(${CX + sai * 220},${lerp(CY - 520, CY, cai)}) scale(${1 - sai * .12})`);
  const abre = smooth(p(t, 4.7, 5.3)) - smooth(p(t, 11.3, 11.7));
  $("abaE").setAttribute("transform", `translate(0,-210) rotate(${-abre * 128} -130 -34) `);
  $("abaD").setAttribute("transform", `translate(0,-210) rotate(${abre * 128} 130 -34)`);
  // duvida em cima da cabeca
  const d = spring(t - 5.8, SPR.snappy) * (1 - sharp(p(t, 7.1, 7.4)));
  $("duvida").setAttribute("opacity", cl(d));
  $("duvida").setAttribute("transform", `translate(${BX + 150},${BY - 800 - d * 14}) scale(${lerp(.7, 1, cl(d))}) rotate(${Math.sin(t * 5) * 5})`);
  // calendario: sobe aos 7,6 s, marca um dia a cada 0,28 s, sai aos 11,3 s
  const ce = smooth(p(t, 7.6, 8.2)), cs = sharp(p(t, 11.2, 11.6));
  $("cal").setAttribute("opacity", Math.min(ce, 1 - cs));
  $("cal").setAttribute("transform", `translate(560,${lerp(850, 800, ce) - cs * 30})`);
  for (let i = 0; i < 7; i++) {
    const k = spring(t - (8.5 + i * .28), SPR.snappy);
    $("ok" + i).setAttribute("opacity", cl(k * 1.4));
    $("ok" + i).setAttribute("transform", `translate(47,45) scale(${lerp(.7, 1, k)}) translate(-47,-45)`);
  }
  // moedas: saem da direita em arco e chegam na mao estendida
  const MX = 480, MY = 1055;
  for (let i = 0; i < 7; i++) {
    const a = 12.1 + i * .16, k = eio(p(t, a, a + .75));
    const x = lerp(930, MX, k), y = lerp(1270, MY, k) - Math.sin(k * Math.PI) * 230;
    $("m" + i).setAttribute("opacity", k > 0 && k < 1 ? 1 : 0);
    $("m" + i).setAttribute("transform", `translate(${x},${y}) scale(${lerp(1, .7, k)})`);
  }
  const v = spring(t - 13.3, SPR.snappy) * (1 - sharp(p(t, 14.7, 15.0)));
  $("volta").setAttribute("opacity", cl(v));
  $("volta").setAttribute("transform", `translate(720,${1250 - v * 16}) scale(${lerp(.9, 1, cl(v))})`);
}

/* Falas (uma por vez: a anterior sai antes da proxima entrar) e fechamento. */
const F = { f1:[.2,3.5], f2:[3.9,7.2], f3:[7.5,11.3], f4:[11.6,14.9] };
function render(t) {
  for (const k in F) show($(k), t, F[k][0], F[k][1], D.sm);
